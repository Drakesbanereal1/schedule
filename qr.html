<title>Schedule QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  body{margin:0;background:#fff;color:#12202e;font-family:-apple-system,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .card{text-align:center;max-width:460px}
  .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#b8863b;font-weight:700}
  h1{font-family:Georgia,serif;font-size:24px;margin:6px 0 2px}
  .sub{color:#5d6b78;font-size:14px;margin-bottom:20px}
  #qr{width:300px;height:300px;margin:0 auto;background:#fff;padding:14px;border:1px solid #e4e7ea;border-radius:14px}
  #qr svg{width:100%;height:100%;display:block}
  .url{font-family:ui-monospace,Menlo,monospace;font-size:13px;margin-top:16px;word-break:break-all;color:#12202e}
  .hint{font-size:12px;color:#8a97a2;margin-top:10px}
  @media print{.hint{display:none}}
</style>
<div class="card">
  <div class="k">Edmonds College · Fall 2026</div>
  <h1>Nhan's Class Schedule</h1>
  <div class="sub">Scan with any phone camera</div>
  <div id="qr"></div>
  <div class="url">https://drakesbanereal1.github.io/schedule/</div>
  <div class="hint">Live after GitHub Pages publish · print or screenshot this</div>
</div>
<script>
  var url="https://drakesbanereal1.github.io/schedule/";
  var q=qrcode(0,"M");q.addData(url);q.make();
  document.getElementById("qr").innerHTML=q.createSvgTag({cellSize:6,margin:1,scalable:true});
</script>
